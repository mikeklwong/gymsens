services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: gymsens-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  trainer:
    profiles: ["learning"]
    build:
      context: .
      dockerfile: Dockerfile.train
    image: gymsens-trainer:local
    restart: unless-stopped
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
