name: Bootstrap gymsens source
on:
  push:
    paths:
      - '.gymsens-source.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .gymsens-source.tar.xz.b64
          base64 -d .gymsens-source.tar.xz.b64 | tar -xJ
          rm .gymsens-source.tar.xz.b64
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish gymsens v0.3.0 source"
          git push origin HEAD:main
