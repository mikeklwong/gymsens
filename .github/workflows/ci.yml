name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt fastapi uvicorn
      - run: python -m compileall -q gym_core.py gym_occupancy.py gymsens_api.py gymsens_learning.py evaluate.py
      - run: pytest -q
